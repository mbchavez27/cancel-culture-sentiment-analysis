[project]
name = "cancel-culture-sentiment-analysis"
version = "1.0.0"
description = "Social network and sentiment analysis of YouTube audience responses to South Korean influencer apology videos"
readme = "README.md"
license = "MIT"
# Results in the paper were produced with Python 3.14.3 (see .python-version); 3.12+ resolves
# to the same locked dependency versions.
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "tqdm>=4.66.0",
    "python-dateutil>=2.9.0.post0",
    "kss>=3.0.1",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
    "scikit-posthocs>=0.9",
    "torch>=2.0",
    "transformers>=4.30",
    "huggingface-hub>=0.20",
    "jupyter",
    "ipykernel>=6.29.5",
    "nbconvert>=7.16.4",
]

[project.urls]
Homepage = "https://dynamics-cc.vercel.app/"
Repository = "https://github.com/mbchavez27/cancel-culture-sentiment-analysis"

[tool.uv]
# Analysis environment only; not an installable package
package = false
